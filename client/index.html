    <title>Sutaeru: ask once, Sutaeru does the rest</title>
    <script>
      /* Restore the saved appearance before the first paint, so a dark choice never
         flashes light. Mirrors client/src/lib/theme.ts; keep the keys in step. */
      (function () {
        try {
          var s = window.localStorage, r = document.documentElement;
          var mode = s.getItem("sutaeru.theme");
          if (mode === "light" || mode === "dark") {
            r.dataset.mode = mode;
            r.dataset.theme = mode;
          }
          if (s.getItem("sutaeru.reduce-motion") === "true") r.dataset.reduceMotion = "true";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            var dark = mode === "dark" || (mode !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
            meta.setAttribute("content", dark ? "#1C1B19" : "#F7F6F2");
          }
        } catch (e) { /* storage blocked: follow the OS */ }
      })();
    </script>
    <meta name="description" content="Search, deep research and agents that keep working while you are away." />
