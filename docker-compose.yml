services:
  sutaeru:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5000:5000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5000
    volumes:
      - ./secrets:/run/secrets:ro
      - ./sutaeru-data/files:/root/sr1-data/files
      # vps_files tool (admin-only, read-only). Secret paths are blocked in code.
      - ./sutaeru-data/wa-auth:/data/wa-auth
      - /root/sr1:/vps/sr1:ro
      - /root/kimi-work:/vps/kimi-work:ro
    restart: unless-stopped
    # The VPS resolver drops lookups now and then (EAI_AGAIN), which made every model call fail.
    # Several public resolvers plus a short timeout with retries keep one lost lookup from failing a chat turn.
    dns:
      - 1.1.1.1
      - 8.8.8.8
      - 9.9.9.9
    dns_opt:
      - timeout:2
      - attempts:4
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  # Optional: PostgreSQL database
  postgres:
    # postgres:16-alpine + pgvector, built from ops/postgres (runbook: ops/postgres/README.md)
    build: ./ops/postgres
    environment:
      POSTGRES_USER: sutaeru
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: sutaeru
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # host port mapping intentionally removed: DB stays on the internal
    # compose network; re-add "5432:5432" here only if external DB access needed
    restart: unless-stopped

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
