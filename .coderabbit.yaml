# CodeRabbit: second pair of eyes on PRs into develop and main. Kept quiet on purpose.
language: "en-US"
reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: false
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "develop"
      - "main"
    ignore_title_keywords:
      - "WIP"
chat:
  auto_reply: false
