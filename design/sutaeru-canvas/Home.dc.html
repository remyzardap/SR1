<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sutaeru home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="{{rootStyle}}">
  <svg aria-hidden="true" width="390" height="844" style="position:absolute;left:0;top:0;pointer-events:none;mix-blend-mode:overlay;opacity:.09;z-index:5"><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="4" stitchTiles="stitch"/><feColorMatrix type="matrix" values=".33 .33 .33 0 0 .33 .33 .33 0 0 .33 .33 .33 0 0 0 0 0 0 1"/></filter><rect width="390" height="844" filter="url(#grain)"/></svg>

  <!-- header -->
  <header style="display:flex;align-items:center;justify-content:space-between;height:60px;padding:0 20px;flex-shrink:0;border-bottom:1px solid var(--hair)">
    <button type="button" aria-label="Open menu" style="display:flex;align-items:center;gap:6px;border:0;background:none;padding:0;height:44px;color:var(--ink)">
      <svg width="46" height="25" viewBox="0 0 144 76" fill="none" aria-hidden="true"><path d="M72 38C64 18 52 8 36 8C19 8 8 20 8 38s11 30 28 30c16 0 28-10 36-30C80 18 92 8 108 8c17 0 28 12 28 30s-11 30-28 30c-16 0-28-10-36-30Z" stroke="currentColor" stroke-width="9" stroke-linejoin="round"/><g transform="translate(108 39) scale(.94) translate(-108 -39)"><circle cx="108" cy="46.6" r="6.8" fill="#F4511E"/><g fill="currentColor"><path d="M88.6 20.8L90.4 22.2Q108 27.4 125.6 22.2L127.4 20.8L126.6 26.0Q108 31.4 89.4 26.0Z"/><path d="M89.8 34.6H126.2V38.4H89.8Z"/><path d="M95.6 25.5H99.8L98.8 57.6H94.4ZM116.2 25.5H120.4L121.6 57.6H117.2Z"/></g></g></svg>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--quiet)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <div role="tablist" aria-label="Mode" style="position:relative;display:flex;width:188px;height:44px;padding:4px;box-sizing:border-box;border-radius:22px;background:var(--panel);border:1px solid var(--stroke)">
      <div style="position:absolute;left:4px;top:4px;width:88px;height:34px;border-radius:17px;background:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.18)"></div>
      <button type="button" role="tab" aria-selected="true" style="position:relative;flex:1;border:0;background:none;font-family:var(--disp);font-weight:700;font-size:16px;color:var(--paper);letter-spacing:-.01em">Chat</button>
      <button type="button" role="tab" aria-selected="false" style="position:relative;flex:1;border:0;background:none;font-family:var(--disp);font-weight:600;font-size:16px;color:var(--quiet);letter-spacing:-.01em">Agent</button>
    </div>
    <button type="button" aria-label="Account, R" style="width:44px;height:44px;border-radius:50%;border:0;background:var(--ink);color:var(--paper);font-family:var(--disp);font-weight:700;font-size:17px">R</button>
  </header>

  <!-- main -->
  <main style="position:relative;flex:1;min-height:0;display:flex;flex-direction:column;padding:0 20px">
    <span aria-hidden="true" style="position:absolute;left:16px;top:14px;width:11px;height:11px;background:linear-gradient(var(--rule),var(--rule)) center/1px 11px no-repeat,linear-gradient(var(--rule),var(--rule)) center/11px 1px no-repeat;opacity:.45"></span>
    <span aria-hidden="true" style="position:absolute;right:16px;top:14px;width:11px;height:11px;background:linear-gradient(var(--rule),var(--rule)) center/1px 11px no-repeat,linear-gradient(var(--rule),var(--rule)) center/11px 1px no-repeat;opacity:.45"></span>

    <!-- hero -->
    <section style="display:flex;flex-direction:column;align-items:center;padding-top:34px;text-align:center">
      <svg width="104" height="55" viewBox="0 0 144 76" fill="none" aria-hidden="true" style="color:var(--ink)"><path d="M72 38C64 18 52 8 36 8C19 8 8 20 8 38s11 30 28 30c16 0 28-10 36-30C80 18 92 8 108 8c17 0 28 12 28 30s-11 30-28 30c-16 0-28-10-36-30Z" stroke="currentColor" stroke-width="9" stroke-linejoin="round"/><g transform="translate(108 39) scale(.9) translate(-108 -39)"><clipPath id="homeSunClip"><rect x="84" y="10" width="48" height="50.2"/></clipPath><g clip-path="url(#homeSunClip)"><circle cx="108" cy="46.4" r="6.3" fill="#F4511E"/></g><g fill="currentColor"><path d="M89.2 21.4L90.5 22.5Q108 27.1 125.5 22.5L126.8 21.4L126.2 25.0Q108 29.9 89.8 25.0Z"/><path d="M91.6 26.7Q108 30.7 124.4 26.7L124.2 28.9Q108 32.9 91.8 28.9Z"/><path d="M106.7 30.4H109.3V35.2H106.7Z"/><path d="M90.6 35.1H125.4V37.7H90.6Z"/><path d="M95.8 27.6H99.6L98.6 57.6H94.4ZM116.4 27.6H120.2L121.6 57.6H117.4Z"/></g><g stroke="currentColor" stroke-linecap="round"><path d="M91.6 60.6H103.2M112.8 60.6H124.4" stroke-width="1.7"/></g><g stroke="#F4511E" stroke-linecap="round"><path d="M104.8 60.6H111.2" stroke-width="1.7"/><path d="M106.3 63.8H109.7" stroke-width="1.5"/></g></g></svg>
      <h1 style="margin:14px 0 0;font-family:var(--disp);font-weight:800;font-size:54px;line-height:1;letter-spacing:-.045em;color:var(--ink)">Sutaeru</h1>
      <p style="margin:14px 0 0;font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.24em;color:var(--quiet);text-transform:uppercase">Ask once. We do the rest.</p>
      <div aria-hidden="true" style="display:flex;align-items:center;justify-content:center;gap:6px;height:14px;margin-top:20px">
        <sc-for list="{{dots}}" as="d" hint-placeholder-count="15">
          <span style="{{d.style}}"></span>
        </sc-for>
      </div>
    </section>

    <!-- recent -->
    <section aria-labelledby="recent-h" style="margin-top:26px">
      <h2 id="recent-h" style="margin:0 0 6px 2px;font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.24em;color:var(--quiet);text-transform:uppercase">Recently updated</h2>
      <a href="#" style="display:flex;align-items:center;gap:14px;min-height:60px;padding:6px 4px;border-radius:20px">
        <span style="position:relative;flex:none;width:48px;height:48px;border-radius:50%;background:var(--accent-tint);display:grid;place-items:center">
          <span style="position:absolute;inset:5px;border-radius:50%;border:1.5px dashed var(--accent);opacity:.7"></span>
          <span style="width:12px;height:12px;border-radius:50%;background:var(--accent)"></span>
        </span>
        <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:7px">
          <span style="font-family:var(--disp);font-weight:600;font-size:17px;letter-spacing:-.01em;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Solar PV supplier research</span>
          <span style="display:flex;align-items:center;gap:10px">
            <span aria-hidden="true" style="position:relative;width:132px;height:4px;border-radius:2px;background:var(--stroke);overflow:hidden"><span style="position:absolute;left:0;top:0;bottom:0;width:40%;border-radius:2px;background:var(--ink)"></span><span style="position:absolute;left:40%;top:0;bottom:0;width:14px;background:linear-gradient(90deg,var(--ink),transparent);opacity:.55"></span></span>
            <span style="font-family:var(--mono);font-size:12px;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums">40%</span>
          </span>
        </span>
        <span style="flex:none;font-size:14px;color:var(--quiet);font-variant-numeric:tabular-nums">Now</span>
      </a>
      <a href="#" style="display:flex;align-items:center;gap:14px;min-height:60px;padding:6px 4px;border-radius:20px">
        <span style="flex:none;width:48px;height:48px;border-radius:50%;background:var(--panel);display:grid;place-items:center;color:var(--ink)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.2 4.2L19 7"/></svg></span>
        <span style="flex:1;min-width:0;font-family:var(--disp);font-weight:600;font-size:17px;letter-spacing:-.01em;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">How fast do commercial rooftop systems pay back?</span>
        <span style="flex:none;font-size:14px;color:var(--quiet)">Yesterday</span>
      </a>
      <a href="#" style="display:flex;align-items:center;gap:14px;min-height:60px;padding:6px 4px;border-radius:20px">
        <img alt="" src="/_blob/e24a42d7f9f98da8d09013c2da486fca" style="flex:none;width:48px;height:48px;border-radius:50%;object-fit:cover;background:var(--panel)">
        <span style="flex:1;min-width:0;font-family:var(--disp);font-weight:600;font-size:17px;letter-spacing:-.01em;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Ceramic mug, morning light</span>
        <span style="flex:none;font-size:14px;color:var(--quiet)">2 days ago</span>
      </a>
    </section>

    <!-- hand off -->
    <a href="#" style="margin-top:auto;display:flex;align-items:center;gap:14px;height:76px;padding:0 12px 0 14px;border-radius:30px;background:var(--hero);color:var(--hero-ink);box-shadow:var(--shadow);position:relative;overflow:hidden">
      <span style="flex:none;width:48px;height:48px;border-radius:16px;background:var(--hero-ink);color:var(--hero);display:grid;place-items:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></svg></span>
      <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;padding-right:20px">
        <span style="font-family:var(--disp);font-weight:700;font-size:19px;letter-spacing:-.02em;white-space:nowrap">Hand off a project</span>
        <span style="font-size:14px;color:var(--hero-quiet);white-space:nowrap">Works while you are away</span>
      </span>
      <span aria-hidden="true" style="position:absolute;right:60px;top:0;bottom:0;width:130px;background-image:radial-gradient(circle,var(--hero-ink) 1px,transparent 1.5px);background-size:6px 6px;opacity:.2;-webkit-mask-image:linear-gradient(90deg,transparent,#000 62%,transparent);mask-image:linear-gradient(90deg,transparent,#000 62%,transparent)"></span>
      <span style="flex:none;width:52px;height:52px;border-radius:50%;background:var(--hero-ink);color:var(--hero);display:grid;place-items:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M8 7h9v9"/></svg></span>
    </a>
  </main>

  <!-- composer -->
  <footer style="position:relative;flex:none;padding:16px 20px 20px">
    <div style="position:relative;border-radius:32px;background:var(--card);border:1px solid var(--stroke);box-shadow:var(--shadow)">
      <i aria-hidden="true" style="position:absolute;left:-9px;top:-9px;width:13px;height:13px;border-left:1.5px solid var(--ink);border-top:1.5px solid var(--ink);border-top-left-radius:5px;opacity:.5"></i>
      <i aria-hidden="true" style="position:absolute;right:-9px;top:-9px;width:13px;height:13px;border-right:1.5px solid var(--ink);border-top:1.5px solid var(--ink);border-top-right-radius:5px;opacity:.5"></i>
      <i aria-hidden="true" style="position:absolute;left:-9px;bottom:-9px;width:13px;height:13px;border-left:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);border-bottom-left-radius:5px;opacity:.5"></i>
      <i aria-hidden="true" style="position:absolute;right:-9px;bottom:-9px;width:13px;height:13px;border-right:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);border-bottom-right-radius:5px;opacity:.5"></i>
      <label for="ask" style="display:block;padding:20px 24px 4px;font-size:17px;line-height:1.3;color:var(--quiet)">Ask anything…</label>
      <input id="ask" type="text" aria-label="Ask anything" style="position:absolute;opacity:0;pointer-events:none;width:1px;height:1px">
      <div style="display:flex;align-items:center;gap:6px;padding:12px 10px 10px 10px">
        <button type="button" aria-label="Add a file" style="flex:none;width:44px;height:44px;border-radius:50%;border:0;background:none;color:var(--ink);display:grid;place-items:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
        <button type="button" aria-pressed="true" style="flex:none;display:flex;align-items:center;gap:8px;height:44px;padding:0 16px 0 14px;border-radius:22px;border:0;background:var(--panel);color:var(--ink);font-family:var(--disp);font-weight:600;font-size:16px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></svg>Thinking</button>
        <button type="button" aria-label="Search the web" style="flex:none;width:44px;height:44px;border-radius:50%;border:0;background:none;color:var(--ink);display:grid;place-items:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg></button>
        <span style="flex:1"></span>
        <button type="button" aria-pressed="false" aria-label="Private" style="flex:none;width:44px;height:44px;border-radius:50%;border:0;background:none;color:var(--quiet);display:grid;place-items:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18M10.6 6.2A9.8 9.8 0 0 1 12 6c5 0 8.5 4 9.5 6a14 14 0 0 1-2.7 3.4M6.6 7.7A14 14 0 0 0 2.5 12c1 2 4.5 6 9.5 6 1.4 0 2.6-.3 3.7-.8M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></button>
        <button type="button" aria-label="Speak" style="flex:none;width:48px;height:48px;border-radius:50%;border:0;background:var(--ink);color:var(--paper);display:grid;place-items:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 10v4M9 7v10M13 4v16M17 8v8M21 11v2"/></svg></button>
      </div>
    </div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.theme === 'dark';
    const v = dark ? {
      paper:'#1C1B19',panel:'#2E2D2A',card:'#252421',stroke:'#3A3935',ink:'#F4F2EC',quiet:'#B6BBC3',rule:'#6B6964',
      accent:'#F4511E',tint:'rgba(244,81,30,.16)',hero:'#131211',heroInk:'#F4F2EC',heroQuiet:'rgba(244,242,236,.6)',hair:'rgba(244,242,236,.12)',
      shadow:'0 1px 2px rgba(0,0,0,.3),0 18px 40px -22px rgba(0,0,0,.7)'
    } : {
      paper:'#F7F6F2',panel:'#EFEDE7',card:'#FFFFFF',stroke:'#E3E1DB',ink:'#242320',quiet:'#66645F',rule:'#B6BBC3',
      accent:'#F4511E',tint:'#FCE9DE',hero:'#242320',heroInk:'#F7F6F2',heroQuiet:'rgba(247,246,242,.62)',hair:'rgba(36,35,32,.14)',
      shadow:'0 1px 2px rgba(36,35,32,.06),0 18px 40px -22px rgba(36,35,32,.28)'
    };
    const rootStyle = [
      'width:390px','height:844px','box-sizing:border-box','display:flex','flex-direction:column','overflow:hidden','position:relative',
      'background:' + v.paper,
      '--paper:' + v.paper,'--panel:' + v.panel,'--card:' + v.card,'--stroke:' + v.stroke,'--ink:' + v.ink,'--quiet:' + v.quiet,'--rule:' + v.rule,
      '--accent:' + v.accent,'--accent-tint:' + v.tint,'--hero:' + v.hero,'--hero-ink:' + v.heroInk,'--hero-quiet:' + v.heroQuiet,'--hair:' + v.hair,'--shadow:' + v.shadow,
      "--disp:'Inter Tight','Inter',system-ui,sans-serif","--body:'Inter',system-ui,sans-serif","--mono:'JetBrains Mono',ui-monospace,monospace",
      "font-family:'Inter',system-ui,sans-serif",'color:' + v.ink,'-webkit-font-smoothing:antialiased'
    ].join(';');
    const dots = [];
    for (let i = 0; i < 27; i++) {
      const t = Math.sin(Math.PI * i / 26);
      const s = 1.6 + 11.4 * Math.pow(t, 1.7);
      dots.push({
        style: 'flex:none;width:' + s.toFixed(1) + 'px;height:' + s.toFixed(1) + 'px;border-radius:50%;background:var(--ink);opacity:' + (0.10 + 0.78 * Math.pow(t, 1.1)).toFixed(2)
      });
    }
    const on = [1,1,0,1,1,0,1,0,1,1];
    const matrix = on.map((o, i) => ({
      style: 'width:4px;height:4px;border-radius:50%;background:var(--hero-ink);opacity:' + (o ? 0.95 : 0.22)
    }));
    return { rootStyle, dots, matrix };
  }
}
</script>
</body>
</html>
