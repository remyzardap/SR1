<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sutaeru files</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
.ph-jakarta{background-image:url(/_blob/bd4c30db7a35785ac23b7bd118ae5144)}
</style>
</helmet>
<div style="{{rootStyle}}">
  <svg aria-hidden="true" width="390" height="844" style="position:absolute;left:0;top:0;pointer-events:none;mix-blend-mode:overlay;opacity:.09;z-index:5"><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="4" stitchTiles="stitch"/><feColorMatrix type="matrix" values=".33 .33 .33 0 0 .33 .33 .33 0 0 .33 .33 .33 0 0 0 0 0 0 1"/></filter><rect width="390" height="844" filter="url(#grain)"/></svg>

  <header style="display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:60px;padding:0 20px;flex-shrink:0;border-bottom:1px solid var(--hair)">
    <button type="button" aria-label="Open menu" style="justify-self:start;display:flex;align-items:center;gap:6px;border:0;background:none;padding:0;height:44px;color:var(--ink)">
      <svg width="46" height="25" viewBox="0 0 144 76" fill="none" aria-hidden="true"><path d="M72 38C64 18 52 8 36 8C19 8 8 20 8 38s11 30 28 30c16 0 28-10 36-30C80 18 92 8 108 8c17 0 28 12 28 30s-11 30-28 30c-16 0-28-10-36-30Z" stroke="currentColor" stroke-width="9" stroke-linejoin="round"/><g transform="translate(108 39) scale(.94) translate(-108 -39)"><circle cx="108" cy="46.6" r="6.8" fill="#F4511E"/><g fill="currentColor"><path d="M88.6 20.8L90.4 22.2Q108 27.4 125.6 22.2L127.4 20.8L126.6 26.0Q108 31.4 89.4 26.0Z"/><path d="M89.8 34.6H126.2V38.4H89.8Z"/><path d="M95.6 25.5H99.8L98.8 57.6H94.4ZM116.2 25.5H120.4L121.6 57.6H117.2Z"/></g></g></svg>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--quiet)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <span style="font-family:var(--disp);font-weight:700;font-size:18px;letter-spacing:-.015em;color:var(--ink)">Files</span>
    <button type="button" aria-label="Account, R" style="justify-self:end;width:44px;height:44px;border-radius:50%;border:0;background:var(--ink);color:var(--paper);font-family:var(--disp);font-weight:700;font-size:17px">R</button>
  </header>

  <main style="position:relative;flex:1;min-height:0;overflow:hidden;padding:0 20px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-top:26px">
      <h1 style="margin:0;font-family:var(--disp);font-weight:800;font-size:46px;line-height:1;letter-spacing:-.045em;color:var(--ink)">Files</h1>
      <button type="button" style="display:inline-flex;align-items:center;gap:8px;height:50px;padding:0 24px 0 20px;border-radius:25px;border:0;background:var(--ink);color:var(--paper);font-family:var(--disp);font-weight:700;font-size:17px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Upload</button>
    </div>
    <p style="margin:12px 0 0;font-size:17px;line-height:1.45;color:var(--quiet)">Everything Sutaeru made for you, and everything you gave it.</p>

    <!-- storage -->
    <section aria-label="Storage" style="margin-top:20px;padding:16px 20px 18px;border-radius:26px;background:var(--card);border:1px solid var(--stroke);box-shadow:var(--shadow)">
      <div style="display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase"><span style="color:var(--quiet)">Storage</span><span style="color:var(--ink)">2.4 of 10 GB</span></div>
      <div role="img" aria-label="2.4 of 10 gigabytes used" style="display:flex;gap:4px;margin-top:12px">
        <sc-for list="{{segs}}" as="s" hint-placeholder-count="24"><span style="{{s.style}}"></span></sc-for>
      </div>
    </section>

    <!-- search -->
    <label style="display:flex;align-items:center;gap:12px;height:54px;margin-top:14px;padding:0 20px;border-radius:27px;background:var(--card);border:1px solid var(--stroke);box-shadow:var(--shadow);color:var(--quiet);font-size:17px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
      <span style="flex:1">Search files</span>
      <input type="search" aria-label="Search files" style="position:absolute;opacity:0;pointer-events:none;width:1px;height:1px">
    </label>

    <!-- filters -->
    <div role="tablist" aria-label="Filter" style="display:flex;gap:10px;margin:14px -20px 0;padding:0 20px;overflow:hidden">
      <button type="button" role="tab" aria-selected="true" style="flex:none;height:44px;padding:0 20px;border-radius:22px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);font-family:var(--disp);font-weight:700;font-size:16px">All</button>
      <button type="button" role="tab" aria-selected="false" style="flex:none;height:44px;padding:0 20px;border-radius:22px;border:1px solid var(--stroke);background:var(--card);color:var(--ink);font-family:var(--disp);font-weight:600;font-size:16px">Reports</button>
      <button type="button" role="tab" aria-selected="false" style="flex:none;height:44px;padding:0 20px;border-radius:22px;border:1px solid var(--stroke);background:var(--card);color:var(--ink);font-family:var(--disp);font-weight:600;font-size:16px">Decks</button>
      <button type="button" role="tab" aria-selected="false" style="flex:none;height:44px;padding:0 20px;border-radius:22px;border:1px solid var(--stroke);background:var(--card);color:var(--ink);font-family:var(--disp);font-weight:600;font-size:16px">Sheets</button>
      <button type="button" role="tab" aria-selected="false" style="flex:none;height:44px;padding:0 20px;border-radius:22px;border:1px solid var(--stroke);background:var(--card);color:var(--ink);font-family:var(--disp);font-weight:600;font-size:16px">Images</button>
    </div>

    <!-- file card: report -->
    <a href="#" style="display:block;margin-top:16px;padding:10px 10px 18px;border-radius:30px;background:var(--card);border:1px solid var(--stroke);box-shadow:var(--shadow)">
      <span aria-hidden="true" style="position:relative;display:block;height:164px;border-radius:22px;background:var(--panel);overflow:hidden">
        <span style="position:absolute;left:96px;top:24px;width:96px;height:132px;border-radius:5px;background:#fff;opacity:.88;transform:rotate(-5deg);box-shadow:0 2px 8px rgba(0,0,0,.14)"></span>
        <span style="position:absolute;left:138px;top:16px;width:104px;height:148px;border-radius:5px;background:#fff;transform:rotate(3deg);box-shadow:0 6px 14px rgba(0,0,0,.18);overflow:hidden">
          <img alt="" src="/_blob/e3b50a116e7d1fbd401b62e3fcd2e0c2" style="display:block;width:100%;height:60px;object-fit:cover">
          <span style="display:block;margin:9px 10px 0;font-family:var(--disp);font-weight:800;font-size:9px;line-height:1.1;color:#242320;letter-spacing:-.01em">Off grid solar<br>cost per kWh</span>
          <span style="display:block;margin:6px 10px 0;height:3px;width:62px;background:#B6BBC3;border-radius:2px"></span>
          <span style="display:block;margin:4px 10px 0;height:3px;width:70px;background:#B6BBC3;border-radius:2px"></span>
          <span style="display:flex;gap:5px;margin:9px 10px 0"><i style="flex:1;height:22px;background:#EFEDE7;border-radius:3px"></i><i style="flex:1;height:22px;background:#EFEDE7;border-radius:3px"></i><i style="flex:1;height:22px;background:#242320;border-radius:3px"></i></span>
        </span>
      </span>
      <span style="display:block;margin:16px 10px 0;font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.2em;color:var(--quiet);text-transform:uppercase">Report</span>
      <span style="display:block;margin:7px 10px 0;font-family:var(--disp);font-weight:700;font-size:21px;letter-spacing:-.02em;color:var(--ink)">Off grid solar cost per kWh</span>
      <span style="display:block;margin:5px 10px 0;font-size:15px;color:var(--quiet)">Edited 2 h ago · 14 sources</span>
    </a>

    <!-- file card: deck (cropped) -->
    <a href="#" style="display:block;margin-top:14px;padding:10px 10px 18px;border-radius:30px;background:var(--card);border:1px solid var(--stroke);box-shadow:var(--shadow)">
      <span aria-hidden="true" style="position:relative;display:block;height:164px;border-radius:22px;background:var(--panel);overflow:hidden">
        <span style="position:absolute;left:58px;top:34px;width:232px;height:114px;border-radius:8px;background:#3a3935;opacity:.5"></span>
        <span class="ph-jakarta" style="position:absolute;left:42px;top:26px;width:232px;height:122px;border-radius:8px;overflow:hidden;background-color:#131211;background-position:center;background-size:cover;box-shadow:0 8px 20px rgba(0,0,0,.3)">
          <span style="position:absolute;inset:0;background:linear-gradient(to top,rgba(19,18,17,.85),rgba(19,18,17,.1))"></span>
          <span style="position:absolute;right:12px;top:10px;font-family:var(--mono);font-size:11px;font-weight:600;color:#F7F6F2">+12%</span>
          <span style="position:absolute;left:14px;bottom:12px;font-family:var(--disp);font-weight:700;font-size:16px;line-height:1.1;color:#F7F6F2">Q3 investor<br>update</span>
        </span>
      </span>
      <span style="display:block;margin:16px 10px 0;font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.2em;color:var(--quiet);text-transform:uppercase">Deck</span>
      <span style="display:block;margin:7px 10px 0;font-family:var(--disp);font-weight:700;font-size:21px;letter-spacing:-.02em;color:var(--ink)">TGWI investor update Q3</span>
    </a>

    <div aria-hidden="true" style="position:absolute;left:0;right:0;bottom:0;height:70px;background:linear-gradient(to bottom,transparent,var(--paper) 85%);pointer-events:none"></div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.theme === 'dark';
    const v = dark ? {
      paper:'#1C1B19',panel:'#2E2D2A',card:'#252421',stroke:'#3A3935',ink:'#F4F2EC',quiet:'#B6BBC3',rule:'#6B6964',
      accent:'#F4511E',tint:'rgba(244,81,30,.16)',hero:'#131211',heroInk:'#F4F2EC',heroQuiet:'rgba(244,242,236,.6)',hair:'rgba(244,242,236,.12)',
      shadow:'0 1px 2px rgba(0,0,0,.3),0 18px 40px -22px rgba(0,0,0,.7)'
    } : {
      paper:'#F7F6F2',panel:'#EFEDE7',card:'#FFFFFF',stroke:'#E3E1DB',ink:'#242320',quiet:'#66645F',rule:'#B6BBC3',
      accent:'#F4511E',tint:'#FCE9DE',hero:'#242320',heroInk:'#F7F6F2',heroQuiet:'rgba(247,246,242,.62)',hair:'rgba(36,35,32,.14)',
      shadow:'0 1px 2px rgba(36,35,32,.06),0 18px 40px -22px rgba(36,35,32,.28)'
    };
    const rootStyle = [
      'width:390px','height:844px','box-sizing:border-box','display:flex','flex-direction:column','overflow:hidden','position:relative',
      'background:' + v.paper,
      '--paper:' + v.paper,'--panel:' + v.panel,'--card:' + v.card,'--stroke:' + v.stroke,'--ink:' + v.ink,'--quiet:' + v.quiet,'--rule:' + v.rule,
      '--accent:' + v.accent,'--accent-tint:' + v.tint,'--hero:' + v.hero,'--hero-ink:' + v.heroInk,'--hero-quiet:' + v.heroQuiet,'--hair:' + v.hair,'--shadow:' + v.shadow,
      "--disp:'Inter Tight','Inter',system-ui,sans-serif","--body:'Inter',system-ui,sans-serif","--mono:'JetBrains Mono',ui-monospace,monospace",
      "font-family:'Inter',system-ui,sans-serif",'color:' + v.ink,'-webkit-font-smoothing:antialiased'
    ].join(';');
    const segs = [];
    for (let i = 0; i < 24; i++) {
      segs.push({ style: 'flex:1;height:24px;border-radius:5px;background:' + (i < 6 ? 'var(--ink)' : 'var(--stroke)') });
    }
    return { rootStyle, segs };
  }
}
</script>
</body>
</html>
