<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sutaeru menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Shippori+Mincho:wght@600&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="{{rootStyle}}">

  <div aria-hidden="true" style="position:absolute;left:0;top:0;width:390px;height:844px;pointer-events:none">
    <dc-import name="Home" theme="{{theme}}" hint-size="390px,844px"></dc-import>
  </div>
  <div aria-hidden="true" style="position:absolute;inset:0;background:var(--scrim)"></div>

  <div role="dialog" aria-label="Menu" aria-modal="true" style="position:absolute;left:0;right:0;bottom:0;padding:10px 20px 28px;border-radius:34px 34px 0 0;background:var(--paper);box-shadow:0 -24px 60px -20px rgba(0,0,0,.35);border-top:1px solid var(--stroke)">
    <span aria-hidden="true" style="display:block;width:44px;height:5px;margin:0 auto;border-radius:3px;background:var(--rule);opacity:.7"></span>

    <div style="display:flex;align-items:center;gap:14px;margin-top:18px">
      <svg width="62" height="33" viewBox="0 0 144 76" fill="none" aria-hidden="true" style="color:var(--ink)"><path d="M72 38C64 18 52 8 36 8C19 8 8 20 8 38s11 30 28 30c16 0 28-10 36-30C80 18 92 8 108 8c17 0 28 12 28 30s-11 30-28 30c-16 0-28-10-36-30Z" stroke="currentColor" stroke-width="9" stroke-linejoin="round"/><g transform="translate(108 39) scale(.94) translate(-108 -39)"><circle cx="108" cy="46.6" r="6.8" fill="#F4511E"/><g fill="currentColor"><path d="M88.6 20.8L90.4 22.2Q108 27.4 125.6 22.2L127.4 20.8L126.6 26.0Q108 31.4 89.4 26.0Z"/><path d="M89.8 34.6H126.2V38.4H89.8Z"/><path d="M95.6 25.5H99.8L98.8 57.6H94.4ZM116.2 25.5H120.4L121.6 57.6H117.2Z"/></g></g></svg>
      <span style="font-family:var(--disp);font-weight:800;font-size:30px;letter-spacing:-.04em;color:var(--ink)">Sutaeru</span>
      <span role="img" aria-label="Sutaeru name seal" style="display:inline-grid;place-items:center;width:30px;height:30px;border-radius:5px;background:#F4511E;color:#F7F6F2;font-family:'Shippori Mincho',serif;font-weight:600;font-size:11px;line-height:1.05;writing-mode:vertical-rl;text-orientation:upright;letter-spacing:0">スタエル</span>
    </div>

    <nav aria-label="Main" style="margin-top:14px">
      <a href="#" aria-current="page" style="display:flex;align-items:center;gap:16px;height:58px;padding:0 16px;border-radius:20px;background:var(--panel);color:var(--ink)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H11l-5 4v-4H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/></svg>
        <span style="flex:1;font-family:var(--disp);font-weight:700;font-size:19px;letter-spacing:-.015em">Chat</span><i aria-hidden="true" style="width:8px;height:8px;border-radius:50%;background:var(--accent)"></i>
      </a>
      <a href="#" style="display:flex;align-items:center;gap:16px;height:58px;padding:0 16px;border-radius:20px;color:var(--ink)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></svg>
        <span style="flex:1;font-family:var(--disp);font-weight:600;font-size:19px;letter-spacing:-.015em">Agent</span><span style="font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--quiet)">1 RUNNING</span>
      </a>
      <a href="#" style="display:flex;align-items:center;gap:16px;height:58px;padding:0 16px;border-radius:20px;color:var(--ink)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/></svg>
        <span style="flex:1;font-family:var(--disp);font-weight:600;font-size:19px;letter-spacing:-.015em">Files</span>
      </a>
      <a href="#" style="display:flex;align-items:center;gap:16px;height:58px;padding:0 16px;border-radius:20px;color:var(--ink)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 9"/></svg>
        <span style="flex:1;font-family:var(--disp);font-weight:600;font-size:19px;letter-spacing:-.015em">Image studio</span>
      </a>
      <a href="#" style="display:flex;align-items:center;gap:16px;height:58px;padding:0 16px;border-radius:20px;color:var(--ink)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>
        <span style="flex:1;font-family:var(--disp);font-weight:600;font-size:19px;letter-spacing:-.015em">Documents</span>
      </a>
      <a href="#" style="display:flex;align-items:center;gap:16px;height:58px;padding:0 16px;border-radius:20px;color:var(--ink)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        <span style="flex:1;font-family:var(--disp);font-weight:600;font-size:19px;letter-spacing:-.015em">Settings</span>
      </a>
    </nav>

    <div style="display:flex;align-items:center;gap:14px;margin-top:12px;padding:14px 4px 0;border-top:1px solid var(--stroke)">
      <span aria-hidden="true" style="flex:none;width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-family:var(--disp);font-weight:700;font-size:17px">R</span>
      <div style="flex:1;min-width:0"><p style="margin:0;font-family:var(--disp);font-weight:700;font-size:17px;letter-spacing:-.01em;color:var(--ink)">Remy</p><p style="margin:2px 0 0;font-size:14px;color:var(--quiet)">Owner</p></div>
      <button type="button" style="flex:none;height:44px;padding:0 20px;border-radius:22px;border:1.5px solid var(--ink);background:none;color:var(--ink);font-family:var(--disp);font-weight:700;font-size:16px">Sign out</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.theme === 'dark';
    const v = dark ? {
      paper:'#1C1B19',panel:'#2E2D2A',card:'#252421',stroke:'#3A3935',ink:'#F4F2EC',quiet:'#B6BBC3',rule:'#6B6964',
      accent:'#F4511E',scrim:'rgba(0,0,0,.55)'
    } : {
      paper:'#F7F6F2',panel:'#EFEDE7',card:'#FFFFFF',stroke:'#E3E1DB',ink:'#242320',quiet:'#66645F',rule:'#B6BBC3',
      accent:'#F4511E',scrim:'rgba(28,27,25,.32)'
    };
    const rootStyle = [
      'width:390px','height:844px','box-sizing:border-box','overflow:hidden','position:relative',
      'background:' + v.paper,
      '--paper:' + v.paper,'--panel:' + v.panel,'--card:' + v.card,'--stroke:' + v.stroke,'--ink:' + v.ink,'--quiet:' + v.quiet,'--rule:' + v.rule,
      '--accent:' + v.accent,'--scrim:' + v.scrim,
      "--disp:'Inter Tight','Inter',system-ui,sans-serif","--body:'Inter',system-ui,sans-serif","--mono:'JetBrains Mono',ui-monospace,monospace",
      "font-family:'Inter',system-ui,sans-serif",'color:' + v.ink,'-webkit-font-smoothing:antialiased'
    ].join(';');
    return { rootStyle, theme: dark ? 'dark' : 'light' };
  }
}
</script>
</body>
</html>
