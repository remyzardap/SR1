<!doctype html>
<html lang="en">
<head>

</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>

<div style="{{rootStyle}}">

  <header style="display:flex;align-items:center;justify-content:space-between;height:60px;padding:0 20px;flex-shrink:0;border-bottom:1px solid var(--hair)">

      <svg width="46" height="25" viewBox="0 0 144 76" fill="none" aria-hidden="true"><path d="M72 38C64 18 52 8 36 8C19 8 8 20 8 38s11 30 28 30c16 0 28-10 36-30C80 18 92 8 108 8c17 0 28 12 28 30s-11 30-28 30c-16 0-28-10-36-30Z" stroke="currentColor" stroke-width="9" stroke-linejoin="round"/><g transform="translate(108 39) scale(.94) translate(-108 -39)"><circle cx="108" cy="46.6" r="6.8" fill="#F4511E"/><g fill="currentColor"><path d="M88.6 20.8L90.4 22.2Q108 27.4 125.6 22.2L127.4 20.8L126.6 26.0Q108 31.4 89.4 26.0Z"/><path d="M89.8 34.6H126.2V38.4H89.8Z"/><path d="M95.6 25.5H99.8L98.8 57.6H94.4ZM116.2 25.5H120.4L121.6 57.6H117.2Z"/></g></g></svg>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--quiet)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <div role="tablist" aria-label="Mode" style="position:relative;display:flex;width:188px;height:44px;padding:4px;box-sizing:border-box;border-radius:22px;background:var(--panel);border:1px solid var(--stroke)">

      <span style="color:var(--quiet)">Build</span>
      <span aria-hidden="true" style="width:22px;height:1px;background:var(--rule)"></span>
      <span style="color:var(--quiet)">Done</span>

    <h1 style="margin:22px 0 0;font-family:var(--disp);font-weight:800;font-size:37px;line-height:1.04;letter-spacing:-.04em;color:var(--ink)">What should Sutaeru make?</h1>

        <i aria-hidden="true" style="position:absolute;right:-8px;top:-8px;width:13px;height:13px;border-right:1.5px solid var(--ink);border-top:1.5px solid var(--ink);border-top-right-radius:6px;opacity:.55"></i>
        <i aria-hidden="true" style="position:absolute;left:-8px;bottom:-8px;width:13px;height:13px;border-left:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);border-bottom-left-radius:6px;opacity:.55"></i>
        <i aria-hidden="true" style="position:absolute;right:-8px;bottom:-8px;width:13px;height:13px;border-right:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);border-bottom-right-radius:6px;opacity:.55"></i>
        <span aria-hidden="true" style="position:relative;display:block;height:108px;border-radius:18px;background:var(--panel);overflow:hidden">
          <span style="position:absolute;left:30px;top:16px;width:70px;height:92px;border-radius:4px;background:#fff;opacity:.9;transform:rotate(-5deg);box-shadow:0 2px 6px rgba(0,0,0,.14)"></span>
          <span style="position:absolute;left:52px;top:12px;width:78px;height:102px;border-radius:4px;background:#fff;transform:rotate(3deg);box-shadow:0 4px 10px rgba(0,0,0,.18);overflow:hidden">
            <span class="ph-solar" style="display:block;height:42px;background-position:center;background-size:cover"></span>
            <span style="display:block;margin:6px 7px 0;height:4px;width:44px;background:#242320;border-radius:2px"></span>
            <span style="display:block;margin:4px 7px 0;height:3px;width:56px;background:#B6BBC3;border-radius:2px"></span>
            <span style="display:block;margin:3px 7px 0;height:3px;width:50px;background:#B6BBC3;border-radius:2px"></span>
            <span style="display:flex;gap:4px;margin:7px 7px 0"><i style="flex:1;height:16px;background:#EFEDE7;border-radius:2px"></i><i style="flex:1;height:16px;background:#EFEDE7;border-radius:2px"></i></span>
          </span>
          <span style="position:absolute;right:10px;top:10px;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.2 4.2L19 7"/></svg></span>
        </span>
        <span style="display:block;margin:14px 8px 0;font-family:var(--disp);font-weight:700;font-size:19px;letter-spacing:-.02em">Report</span>
        <span style="display:block;margin:4px 8px 0;font-size:14px;line-height:1.35;color:var(--quiet)">Cited research, ready to send</span>
      </button>

      <!-- deck -->
      <button type="button" aria-pressed="false" style="text-align:left;padding:8px 8px 14px;border-radius:26px;background:var(--card);border:1px solid var(--stroke);box-shadow:var(--shadow);color:var(--ink)">
        <span aria-hidden="true" style="position:relative;display:block;height:108px;border-radius:18px;background:var(--panel);overflow:hidden">
          <span style="position:absolute;left:34px;top:22px;width:118px;height:66px;border-radius:6px;background:#3a3935;opacity:.6"></span>
          <span class="ph-jakarta" style="position:absolute;left:18px;top:30px;width:120px;height:68px;border-radius:6px;overflow:hidden;background-color:#131211;background-position:center;background-size:cover;box-shadow:0 4px 12px rgba(0,0,0,.28)">
            <span style="position:absolute;inset:0;background:linear-gradient(to top,rgba(19,18,17,.82),rgba(19,18,17,.15))"></span>
            <span style="position:absolute;right:7px;top:6px;font-family:var(--mono);font-size:9px;font-weight:600;color:#F7F6F2">+12%</span>
            <span style="position:absolute;left:8px;bottom:7px;font-family:var(--disp);font-weight:700;font-size:11px;line-height:1.1;color:#F7F6F2">Q3 investor update</span>

        </span>
        <span style="display:block;margin:14px 8px 0;font-family:var(--disp);font-weight:700;font-size:19px;letter-spacing:-.02em">Deck</span>
        <span style="display:block;margin:4px 8px 0;font-size:14px;line-height:1.35;color:var(--quiet)">Slides with charts and notes</span>

        <span style="display:block;margin:4px 8px 0;font-size:14px;line-height:1.35;color:var(--quiet)">Formulas, tabs and totals</span>
      </button>

      <!-- image -->
      <button type="button" aria-pressed="false" style="text-align:left;padding:8px 8px 14px;border-radius:26px;background:var(--card);border:1px solid var(--stroke);box-shadow:var(--shadow);color:var(--ink)">
        <span aria-hidden="true" class="ph-golden" style="position:relative;display:block;height:108px;border-radius:18px;background-color:var(--panel);background-position:center 58%;background-size:cover;overflow:hidden"></span>
        <span style="display:block;margin:14px 8px 0;font-family:var(--disp);font-weight:700;font-size:19px;letter-spacing:-.02em">Image</span>
        <span style="display:block;margin:4px 8px 0;font-size:14px;line-height:1.35;color:var(--quiet)">Set up the shot, then draw</span>
      </button>
    </div>

    <div aria-hidden="true" style="position:absolute;left:0;right:0;bottom:0;height:70px;background:linear-gradient(to bottom,transparent,var(--paper));pointer-events:none"></div>
  </main>

  <footer style="flex:none;display:flex;align-items:center;gap:14px;padding:14px 20px 26px;border-top:1px solid var(--hair);background:var(--paper)">
    <div style="flex:1;min-width:0">
      <p style="margin:0;font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.14em;color:var(--quiet);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Report · Standard · Web</p>
      <p style="margin:5px 0 0;font-family:var(--disp);font-weight:700;font-size:17px;letter-spacing:-.01em;color:var(--ink)">About 5 min · 4 credits</p>
    </div>
    <button type="button" style="flex:none;display:inline-flex;align-items:center;gap:10px;height:56px;padding:0 24px 0 28px;border-radius:28px;border:0;background:var(--ink);color:var(--paper);font-family:var(--disp);font-weight:700;font-size:18px;letter-spacing:-.01em">Start<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  </footer>

<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>

    const v = dark ? {
      paper:'#1C1B19',panel:'#2E2D2A',card:'#252421',stroke:'#3A3935',ink:'#F4F2EC',quiet:'#B6BBC3',rule:'#6B6964',

      shadow:'0 1px 2px rgba(36,35,32,.06),0 18px 40px -22px rgba(36,35,32,.28)'
    };
    const rootStyle = [
      'width:390px','height:844px','box-sizing:border-box','display:flex','flex-direction:column','overflow:hidden','position:relative',
      'background:' + v.paper,
      '--paper:' + v.paper,'--panel:' + v.panel,'--card:' + v.card,'--stroke:' + v.stroke,'--ink:' + v.ink,'--quiet:' + v.quiet,'--rule:' + v.rule,
      '--accent:' + v.accent,'--accent-tint:' + v.tint,'--hero:' + v.hero,'--hero-ink:' + v.heroInk,'--hero-quiet:' + v.heroQuiet,'--hair:' + v.hair,'--shadow:' + v.shadow,
      "--disp:'Inter Tight','Inter',system-ui,sans-serif","--body:'Inter',system-ui,sans-serif","--mono:'JetBrains Mono',ui-monospace,monospace",
      "font-family:'Inter',system-ui,sans-serif",'color:' + v.ink,'-webkit-font-smoothing:antialiased'

    return { rootStyle };
  }
}
</script>
