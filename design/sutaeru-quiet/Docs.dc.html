<style>
body{margin:0}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
textarea{font:inherit;color:inherit}
textarea::placeholder{color:var(--quiet);opacity:1}
.qbar{box-shadow:inset 0 1px 0 var(--hi),0 0 0 1px var(--stroke),0 16px 36px -18px var(--lift);transition:box-shadow .25s}
.qbar:focus-within{box-shadow:inset 0 1px 0 var(--hi),0 0 0 1px var(--stroke),0 20px 44px -18px var(--lift)}
.qtap{transition:transform .18s cubic-bezier(.2,.8,.2,1),opacity .18s}

.qidx{position:absolute;left:8px;top:8px;padding:4px 6px;border-radius:7px;font-size:8px;letter-spacing:.12em;color:#fff;background:rgba(20,18,16,.5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.qlive{position:absolute;right:10px;top:10px;width:8px;height:8px;border-radius:50%;background:#F4511E;box-shadow:0 0 0 3px rgba(244,81,30,.25);animation:qPulse 1.8s ease-in-out infinite}
@keyframes qPulse{0%,100%{box-shadow:0 0 0 3px rgba(244,81,30,.25)}50%{box-shadow:0 0 0 7px rgba(244,81,30,0)}}
.qrow{scrollbar-width:none}.qrow::-webkit-scrollbar{display:none}
.qmono{font-family:'JetBrains Mono',ui-monospace,monospace;font-weight:500;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase}
@keyframes qHero{0%,100%{transform:scale(1) translateY(0)}50%{transform:scale(1.035) translateY(-6px)}}
@keyframes qRise{0%{transform:translateY(14px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes qSwap{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.qcard{border-radius:22px;overflow:hidden;background:var(--panel);box-shadow:0 0 0 1px var(--stroke)}
.qsheen{animation:qSheen 2.6s cubic-bezier(.4,0,.2,1) infinite}
@keyframes qSheen{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
@keyframes qKen{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes qFloat{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-8px) rotate(var(--r,0deg))}}
@keyframes qStamp{0%{transform:scale(2.2) rotate(-24deg);opacity:0}60%{transform:scale(.92) rotate(-12deg);opacity:1}100%{transform:scale(1) rotate(-12deg);opacity:1}}
@keyframes qSpin{to{transform:rotate(360deg)}}

.qidx{position:absolute;left:10px;top:10px;padding:4px 7px;border-radius:7px;font-size:8.5px;letter-spacing:.12em;color:#fff;background:rgba(20,18,16,.5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.qlive{display:inline-block;width:8px;height:8px;border-radius:50%;background:#F4511E;animation:qPulse 1.8s ease-in-out infinite}
@keyframes qPulse{0%,100%{box-shadow:0 0 0 3px rgba(244,81,30,.25)}50%{box-shadow:0 0 0 7px rgba(244,81,30,0)}}
.qdots{background:radial-gradient(circle,var(--stroke) 1.1px,transparent 1.5px) 0 0/14px 14px}
@keyframes qBlink{to{visibility:hidden}}
.qblink{animation:qBlink 1.2s steps(2,start) infinite}
</style>
</helmet>
<div style="{{rootStyle}}">
