name: CI

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run check

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Unit tests (server, shared, client; no e2e, no db)
        run: npm test

  db-tests:
    name: db-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Reports, but does not block, until Phase 2 (P1-01 spec).
    continue-on-error: true
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sutaeru_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sutaeru_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Throwaway database inside the service container; not a secret.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sutaeru_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply migrations to the test database
        run: npm run migrate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Database tests (*.db.test.ts)
        run: npm run test:db
